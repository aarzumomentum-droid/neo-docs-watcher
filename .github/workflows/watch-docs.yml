# Checks docs.neo.work every 15 minutes and tells the Neo Blog Desk about new,
# changed or removed pages. Needs two repository secrets:
#   BLOG_DESK_FIRE_URL  Fire URL of the "Neo Blog Desk docs hook" scheduled task
#   BLOG_DESK_TOKEN     that task's API token
name: Watch docs.neo.work

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be sent"
        type: boolean
        default: false

concurrency:
  group: watch-docs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the docs
        env:
          FIRE_URL: ${{ secrets.BLOG_DESK_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.BLOG_DESK_TOKEN }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL || 'https://docs.neo.work' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python watch_docs.py
      - name: Save the fingerprints
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain -- state/pages.json)" ]; then echo "No change to save."; exit 0; fi
          git config user.name "docs-watcher"
          git config user.email "docs-watcher@users.noreply.github.com"
          git add state/pages.json
          git commit -m "Update docs fingerprints"
          git push
